[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "anthroforge-standalone"
version = "0.4.0"
description = "Standalone anatomical authoring application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = ["numpy==1.26.4", "Pillow==12.3.0"]

[project.optional-dependencies]
desktop = ["PySide6==6.12.0"]
numerics = [
  "numpy==1.26.4", "scipy==1.15.3", "scikit-image==0.25.2",
  "pyinstantmeshes==1.0.0", "pytetwild[all]==0.4.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10", "ruff>=0.14,<1", "mypy>=1.18,<2",
  "cmake==4.2.0", "ninja>=1.13,<2", "build>=1.3,<2",
]
packaging = [
    "nuitka==4.1.1",
    "ordered-set>=4.1.0",
    "zstandard>=0.25.0",
]
qt-sdk = ["aqtinstall==3.3.0"]
cloud = ["clang-tidy==18.1.8; sys_platform == 'linux'", "shellcheck-py==0.10.0.1; sys_platform == 'linux'"]

[project.scripts]
anthroforge = "anthroforge.cli:main"
anthroforge-desktop = "anthroforge.desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anthroforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src/anthroforge/core", "src/anthroforge/application", "src/anthroforge/native", "src/anthroforge/feedback"]

